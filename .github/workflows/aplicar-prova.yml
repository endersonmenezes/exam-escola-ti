name: Aplicar prova (pasta do ano publicada no template)

# Roda em 4 gatilhos para nao depender de um so:
#  - schedule: polling a cada 10 min (minutos :07, :17, ...) — cobre o caso de
#    ninguem interagir com o repo no dia da prova. ATENCAO: schedules sao
#    desativados apos 60 dias sem atividade no repo — por isso os demais gatilhos.
#  - push: qualquer commit re-verifica se a pasta do ano ja apareceu.
#  - issue_comment: aluno comenta "aplicar" na issue para forcar na hora.
#  - workflow_dispatch: gatilho manual.

on:
  schedule:
    - cron: "7-57/10 * * * *"
  push:
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: prova-bot-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  REPO_SLUG: ${{ github.event.repository.name }}
  REPO_FULL: ${{ github.repository }}
  TEMPLATE_URL: ${{ vars.TEMPLATE_URL || 'https://github.com/endersonmenezes/exam-escola-ti.git' }}

jobs:
  aplicar:
    name: Descobrir pasta do ano, aplicar e abrir issue da prova
    # no-op no repositorio-template; em issue_comment, so quando pedem "aplicar"
    if: github.repository != 'endersonmenezes/exam-escola-ti' && (github.event_name != 'issue_comment' || contains(github.event.comment.body, 'aplicar'))
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: aplicar pasta do ano (idempotente)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/aplicar_prova.py
